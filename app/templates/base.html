<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DocFlow{% endblock %} · DocFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/docflow.css') }}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  {% block navbar %}
  <nav class="navbar navbar-expand-md navbar-dark df-navbar">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/admin"><i class="bi bi-folder-symlink me-2"></i>DocFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Navigation umschalten">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if active == 'dashboard' %}active{% endif %}" href="/admin">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link {% if active == 'customers' %}active{% endif %}" href="/admin/customers">Mandanten</a></li>
        </ul>
        <a class="btn btn-sm btn-light" href="/admin/customers/new"><i class="bi bi-plus-lg me-1"></i>Neuer Mandant</a>
      </div>
    </div>
  </nav>
  {% endblock %}

  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="py-3 border-top bg-white">
    <div class="container small text-muted d-flex justify-content-between flex-wrap gap-2">
      <span>DocFlow · Automated Client Document Intake &amp; Routing</span>
      <span>IU Proof of Concept · nur fiktive Testdaten</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Kopieren-Buttons für Upload-Links (data-copy="<text>")
    document.querySelectorAll("[data-copy]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(btn.dataset.copy).then(function () {
          const original = btn.innerHTML;
          btn.innerHTML = '<i class="bi bi-check2"></i> Kopiert';
          setTimeout(function () { btn.innerHTML = original; }, 1500);
        });
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
